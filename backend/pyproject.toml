[project]
name = "editoralflow-backend"
version = "0.1.0"
description = "EditoralFlow backend: an AI editorial desk with grounded fact-checking"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.105",
    "fastapi>=0.136",
    "openai>=2.38",
    "pydantic>=2.13",
    "python-dotenv>=1.2",
    "uvicorn>=0.48",
]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.3",
    "ruff>=0.12",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, B: bugbear, UP: modern syntax, SIM: simplifications
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
